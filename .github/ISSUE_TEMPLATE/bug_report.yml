name: Bug Report
description: Report a reproducible problem in Helix.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for maintainers to reproduce and diagnose the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug and its impact.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Run `...`
        2. Send request to `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: Describe the observed result, including errors or logs if relevant.
    validations:
      required: true
  - type: input
    id: go_version
    attributes:
      label: Go Version
      description: Output of `go version`.
      placeholder: go version go1.25.5 darwin/arm64
    validations:
      required: true
  - type: input
    id: helix_version
    attributes:
      label: Helix Version
      description: Helix version, commit SHA, or branch.
      placeholder: main@<commit-sha> or v0.0.0
    validations:
      required: true
