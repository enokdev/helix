version: '3.8'
services:
  app:
    build:
      context: ../..
      dockerfile: examples/deployment/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "/helix-app", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3
